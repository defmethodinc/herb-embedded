AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  Exclude:
    - "vendor/**/*"
    - "tmp/**/*"

# Gems ship with frozen string literals.
Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always

# Double quotes throughout — avoids churn when interpolation is added.
Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120
  Exclude:
    - "spec/**/*"

# Spec files and Rakefile are naturally longer.
Metrics/MethodLength:
  Max: 20
  Exclude:
    - "spec/**/*"

Metrics/ClassLength:
  Max: 200
  Exclude:
    - "spec/**/*"

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "rakelib/**/*"
    - "*.gemspec"

Metrics/AbcSize:
  Exclude:
    - "spec/**/*"

# Gemspec cops.
Gemspec/DevelopmentDependencies:
  EnforcedStyle: Gemfile

# Inline rescue is readable in simple one-liners (e.g. adapter#dispose).
Style/RescueModifier:
  Enabled: false

# We document intent in commit messages and issue bodies, not in YARD.
Style/Documentation:
  Enabled: false

# Trailing comma in multi-line structures — safer diffs.
Style/TrailingCommaInArguments:
  EnforcedStyleForMultiline: comma

Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: comma

Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: comma
